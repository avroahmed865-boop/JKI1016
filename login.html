    background: #0056b3;

    color: red;

  }

<body>

<div id="loginBox">
  <h2>Login or Signup</h2>
  <input type="text" id="phoneOrEmail" placeholder="Phone number or Email" />
  <div class="error" id="errorMsg"></div>
<button onclick="validateInput()">Continue</button>
</div>

<script>
  function validateInput() {
    const input = document.getElementById('phoneOrEmail').value.trim();
    const errorMsg = document.getElementById('errorMsg');
    if (!input) {
      errorMsg.textContent = 'Please enter your phone number or email.';
      return;
    }
    // Basic email regex
    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+/;
    // Basic phone number regex (digits only, length 7 to 15)
    const phoneRegex = /^[0-9]7,15/;

    if (emailRegex.test(input) || phoneRegex.test(input)) {
      errorMsg.textContent = '';
      // Redirect to your main site after login
      window.location.href = "https://avroahmed865-boop.github.io/JKI1016/";
    } else {
      errorMsg.textContent = 'Please enter a valid phone number or email.';
    }
  }
</script>

</body>
